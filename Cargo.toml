[workspace]
resolver = "2"
members = [
    "crates/hub-core",
    "crates/hub-elevate",
    "crates/hub-helper",
    "src-tauri",
]

[workspace.package]
version = "1.0.2"
edition = "2021"
rust-version = "1.77"
authors = ["Abdul Robi"]
license = "MIT"
repository = "https://github.com/robi/studio-hub"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "process", "sync", "time", "macros", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
sha2 = "0.10"
semver = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
directories = "5"
sysinfo = "0.31"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
windows = "0.58"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
