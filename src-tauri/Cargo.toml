[package]
name = "studio-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Tidak pernah diterbitkan ke crates.io: crate ini hanya bermakna di dalam
# workspace Studio Hub, dan menandainya privat juga membuat dependensi path
# antar-crate di sini sah di mata cargo-deny.
publish = false
description = "Studio Hub — launcher & auto-updater plugin VST3"

[[bin]]
name = "StudioHub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hub-core = { path = "../crates/hub-core" }
hub-elevate = { path = "../crates/hub-elevate" }

tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
url.workspace = true

[features]
# Default Tauri: aktifkan custom protocol saat build produksi.
custom-protocol = ["tauri/custom-protocol"]
