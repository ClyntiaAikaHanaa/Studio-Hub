name: Release Launcher

on:
  push:
    tags: ["launcher-v*.*.*"]

permissions:
  contents: write

jobs:
  # Audit berdiri sendiri di Linux, bukan sebagai langkah di dalam `build`.
  # `cargo-deny-action` adalah Docker action, dan Docker action tidak dapat
  # berjalan di runner Windows sama sekali. Menaruhnya di job `build` yang
  # `windows-latest` akan gagal seketika, apa pun isi deny.toml-nya.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  build:
    needs: audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # Dua instalasi, bukan satu. `@tauri-apps/cli` adalah devDependency di
      # package.json root, sedangkan Svelte dan Vite ada di ui/. Melewatkan yang
      # root membuat perintah `tauri` tidak pernah ada di PATH, dan kegagalannya
      # baru muncul jauh di bawah sebagai "'tauri' is not recognized".
      - run: npm ci
      - run: npm ci --prefix ui

      # Wajib sebelum `cargo test`: build script `tauri-build` menolak jalan
      # kalau sidecar-nya belum ada, dan `beforeBuildCommand` yang biasanya
      # membuatnya baru berjalan di langkah `tauri build` di bawah.
      - name: Stage hub-helper sidecar
        run: node scripts/build-sidecar.mjs

      - run: cargo test --workspace

      # `hub-helper.exe` dibangun dan dipentaskan sebagai sidecar oleh
      # `scripts/build-sidecar.mjs`, yang dipanggil `beforeBuildCommand`. Tanpa
      # itu installer hanya berisi StudioHub.exe dan instalasi all-users gagal
      # saat runtime.
      - name: Build & sign
        env:
          # Ed25519 untuk updater. Tauri mewajibkan verifikasi signature dan
          # tidak menyediakan cara menonaktifkannya — default yang tepat.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi,nsis

      # TODO(code signing): JANGAN menandatangani di sini.
      #
      # Langkah ini dulu berjalan setelah `tauri build` dan menandatangani
      # `target\...\release\*.exe`. Itu tidak ada gunanya: installer sudah
      # terbentuk dan sudah menelan salinan binernya, jadi yang ditandatangani
      # adalah berkas yang tidak pernah dikirim ke siapa pun. Ia juga meleset
      # dari sidecar, yang dibundel dari `src-tauri\binaries\`.
      #
      # Cara yang benar adalah `bundle.windows.signCommand` di tauri.conf.json,
      # yang dipanggil Tauri untuk setiap biner SEBELUM dibundel, plus timestamp
      # RFC 3161 (tanpanya tanda tangan berhenti valid saat sertifikat
      # kedaluwarsa, termasuk pada binary lama yang sudah beredar).
      # Diaktifkan bersamaan dengan pembelian sertifikat (PRD §16.3 jalur 3).

      - name: Generate updater manifest
        run: node scripts/make-latest-json.mjs

      - uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          files: |
            target/**/bundle/msi/*.msi
            target/**/bundle/msi/*.msi.sig
            target/**/bundle/nsis/*.exe
            target/**/bundle/nsis/*.exe.sig
            latest.json
