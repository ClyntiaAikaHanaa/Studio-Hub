name: Release Launcher

on:
  push:
    tags: ["launcher-v*.*.*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      - name: Audit dependencies
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      - run: cargo test --workspace

      # `hub-helper.exe` harus ada di samping StudioHub.exe: itu satu-satunya
      # lokasi yang dicari `default_helper_path()`, dan jalur pencarian yang
      # tetap adalah bagian dari mitigasi T6.
      - name: Build helper
        run: cargo build --release --target x86_64-pc-windows-msvc -p hub-helper

      - name: Build & sign
        env:
          # Ed25519 untuk updater. Tauri mewajibkan verifikasi signature dan
          # tidak menyediakan cara menonaktifkannya — default yang tepat.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles msi,nsis

      # Authenticode. Untuk v1 ini boleh dijalankan manual (PRD §16.3 jalur 3);
      # langkah ini menjadi otomatis begitu cloud signing tersedia.
      # Timestamp RFC 3161 wajib: tanpanya, tanda tangan berhenti valid saat
      # sertifikat kedaluwarsa, termasuk pada binary lama yang sudah beredar.
      - name: Sign binaries
        if: ${{ env.SIGNING_AVAILABLE == 'true' }}
        env:
          SIGNING_AVAILABLE: ${{ secrets.CERT_THUMBPRINT != '' }}
          CERT_THUMBPRINT: ${{ secrets.CERT_THUMBPRINT }}
        run: |
          $targets = @(
            "target\x86_64-pc-windows-msvc\release\StudioHub.exe",
            "target\x86_64-pc-windows-msvc\release\hub-helper.exe"
          )
          foreach ($t in $targets) {
            signtool sign /sha1 $env:CERT_THUMBPRINT /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $t
          }

      - name: Generate updater manifest
        run: node scripts/make-latest-json.mjs

      - uses: softprops/action-gh-release@01570a1f39cb168c169c802c3bceb9e93fb10974 # v2.1.0
        with:
          files: |
            target/**/bundle/msi/*.msi
            target/**/bundle/msi/*.msi.sig
            target/**/bundle/nsis/*.exe
            target/**/bundle/nsis/*.exe.sig
            latest.json
