name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@21dc36fb71dd22e3317045c0c31a3f4249868b17 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      # `hub-core` sengaja tidak bergantung pada Tauri, jadi ia dapat diuji di
      # Linux juga — yang lebih cepat dan menangkap kesalahan `cfg` (PRD §11.1).
      - name: Install Linux GUI deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      # `tauri-build` memvalidasi `externalBin` saat build script berjalan, dan
      # menolak melanjutkan kalau berkas sidecar-nya tidak ada. Berkas itu
      # artefak per-mesin (gitignored), jadi ia tidak pernah ikut checkout.
      #
      # Tanpa langkah ini, `cargo clippy` dan `cargo test` gagal di build script
      # dengan "resource path `binaries/hub-helper-...` doesn't exist" — sebelum
      # satu baris kode proyek ini sempat diperiksa.
      #
      # `node` sudah tersedia di runner GitHub tanpa setup-node.
      - name: Stage hub-helper sidecar
        run: node scripts/build-sidecar.mjs --debug

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Mitigasi T11: setiap dependensi baru harus lolos dua gerbang ini.
      #
      # Versi action dipatok karena versi cargo-deny yang dipaketkannya
      # menentukan kunci konfigurasi mana yang dikenali. v2.1.1 memaketkan
      # cargo-deny 0.20.2, yang mengenali `[advisories] unmaintained`. Versi
      # sebelumnya menolak kunci itu sebagai konfigurasi tak dikenal dan gagal
      # sebelum memeriksa apa pun.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --prefix ui
      - run: npm run check --prefix ui
